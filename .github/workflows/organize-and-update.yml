name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-solutions
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize root solution files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import shutil

          root = Path(".")

          extensions = {
              ".cpp",
              ".cc",
              ".cxx",
              ".c",
              ".py",
              ".java",
              ".js",
              ".ts",
              ".go",
              ".cs",
              ".rs",
              ".sql",
              ".sh",
          }

          ignored = {
              "README.md",
          }

          def git_time(path):
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%ct",
                          "--",
                          str(path)
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

                  value = result.stdout.strip()

                  return int(value) if value else 0

              except Exception:
                  return 0

          moved = 0
          deleted = 0

          # Only inspect files directly in repository root
          for file in list(root.iterdir()):

              if not file.is_file():
                  continue

              if file.name in ignored:
                  continue

              if file.suffix.lower() not in extensions:
                  continue

              # Only LeetCode-style files:
              # 0001-two-sum.cpp
              # 0421-maximum-xor.js
              if not file.name[:4].isdigit():
                  continue

              # Folder name = filename without extension
              folder_name = file.stem

              # Make sure it actually looks like:
              # 0001-two-sum
              if len(folder_name) < 6:
                  continue

              if folder_name[4] != "-":
                  continue

              folder = root / folder_name
              destination = folder / file.name

              print()
              print(f"Processing: {file}")
              print(f"Target folder: {folder}")

              # Folder doesn't exist -> create it
              if not folder.exists():
                  folder.mkdir(parents=True)

                  shutil.move(
                      str(file),
                      str(destination)
                  )

                  print(f"Moved -> {destination}")

                  moved += 1
                  continue

              # Folder already exists
              if destination.exists():

                  root_time = git_time(file)
                  existing_time = git_time(destination)

                  print(f"Root file timestamp: {root_time}")
                  print(f"Existing timestamp:  {existing_time}")

                  if root_time > existing_time:

                      print("Root version is newer.")
                      print("Replacing existing version.")

                      destination.unlink()

                      shutil.move(
                          str(file),
                          str(destination)
                      )

                      moved += 1

                  else:

                      print("Existing version is newer.")
                      print("Removing duplicate root file.")

                      file.unlink()

                      deleted += 1

              else:

                  # Folder exists but this language/file doesn't
                  shutil.move(
                      str(file),
                      str(destination)
                  )

                  print(f"Moved -> {destination}")

                  moved += 1

          print()
          print("==============================")
          print(f"Files moved:   {moved}")
          print(f"Duplicates removed: {deleted}")
          print("==============================")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No organization changes."
            exit 0
          fi

          git commit -m "chore: organize solution files"

      - name: Push
        run: |
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main
