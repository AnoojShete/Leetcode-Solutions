name: Organize Solutions and Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Prevent two workflow runs from pushing at the same time
concurrency:
  group: organize-solutions
  cancel-in-progress: false

jobs:
  organize-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Make sure we are working on the latest main
      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Organize misplaced solution files
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          import shutil

          root = Path(".")

          ignored_files = {
              "README.md",
              "LICENSE",
          }

          solution_extensions = {
              ".cpp",
              ".cc",
              ".cxx",
              ".c",
              ".py",
              ".java",
              ".js",
              ".ts",
              ".go",
              ".cs",
              ".rs",
              ".sql",
              ".sh",
          }

          # Example:
          # 0057-insert-interval.cpp
          # -> 0057-insert-interval/
          problem_pattern = re.compile(
              r"^(\d{4,}-[^/]+)(\.[^.]+)$"
          )

          def git_timestamp(path):
              """
              Return the most recent commit timestamp for a file.
              """
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%ct",
                          "--",
                          str(path)
                      ],
                      capture_output=True,
                      text=True,
                      check=True
                  )

                  value = result.stdout.strip()

                  if value:
                      return int(value)

              except subprocess.CalledProcessError:
                  pass

              return 0

          moved = 0
          removed = 0

          for file in list(root.iterdir()):

              if not file.is_file():
                  continue

              if file.name in ignored_files:
                  continue

              if file.suffix.lower() not in solution_extensions:
                  continue

              match = problem_pattern.match(file.name)

              if not match:
                  continue

              problem_folder = match.group(1)
              destination_dir = root / problem_folder

              # Only organize files when the corresponding
              # LeetCode problem folder already exists.
              if not destination_dir.is_dir():
                  continue

              destination = destination_dir / file.name

              if destination.exists():

                  root_time = git_timestamp(file)
                  folder_time = git_timestamp(destination)

                  if root_time > folder_time:
                      print(
                          f"Newer root version found:"
                          f" {file} -> {destination}"
                      )

                      destination.unlink()
                      shutil.move(str(file), str(destination))

                      moved += 1

                  else:
                      print(
                          f"Keeping newer folder version:"
                          f" {destination}"
                      )

                      file.unlink()

                      removed += 1

              else:
                  print(
                      f"Moving:"
                      f" {file} -> {destination}"
                  )

                  shutil.move(str(file), str(destination))

                  moved += 1

          print()
          print(f"Files moved/replaced: {moved}")
          print(f"Duplicate files removed: {removed}")

            - name: Generate README
        shell: python
        run: |
          from pathlib import Path

          template = Path("README.template.md")
          readme = Path("README.md")

          languages = {
              ".cpp": "CPP",
              ".cc": "CPP",
              ".cxx": "CPP",
              ".py": "PYTHON",
              ".java": "JAVA",
              ".js": "JAVASCRIPT",
              ".ts": "TYPESCRIPT",
              ".go": "GO",
              ".cs": "CSHARP",
              ".rs": "RUST",
              ".sql": "SQL",
              ".sh": "BASH",
              ".c": "C",
          }

          problems = set()
          language_problems = {}

          for directory in Path(".").iterdir():

              if not directory.is_dir():
                  continue

              if directory.name in {
                  ".git",
                  ".github",
                  "node_modules",
              }:
                  continue

              # Only folders like:
              # 0001-two-sum
              # 1234-example-problem
              if len(directory.name) < 6:
                  continue

              if not directory.name[:4].isdigit():
                  continue

              if directory.name[4] != "-":
                  continue

              problem = directory.name
              problems.add(problem)

              for file in directory.iterdir():

                  if not file.is_file():
                      continue

                  if file.name.lower() == "readme.md":
                      continue

                  language = languages.get(
                      file.suffix.lower()
                  )

                  if language:
                      language_problems.setdefault(
                          language, set()
                      ).add(problem)

          values = {
              "TOTAL": len(problems),
              "CPP": len(language_problems.get("CPP", set())),
              "JAVASCRIPT": len(language_problems.get("JAVASCRIPT", set())),
              "PYTHON": len(language_problems.get("PYTHON", set())),
              "JAVA": len(language_problems.get("JAVA", set())),
              "GO": len(language_problems.get("GO", set())),
              "CSHARP": len(language_problems.get("CSHARP", set())),
              "SQL": len(language_problems.get("SQL", set())),
              "BASH": len(language_problems.get("BASH", set())),
              "TYPESCRIPT": len(language_problems.get("TYPESCRIPT", set())),
              "RUST": len(language_problems.get("RUST", set())),
              "C": len(language_problems.get("C", set())),
          }

          # IMPORTANT:
          # README.md is completely rebuilt from the template.
          # Anything added by LeetHub to README.md is discarded.
          content = template.read_text(
              encoding="utf-8"
          )

          for key, value in values.items():
              content = content.replace(
                  "{{" + key + "}}",
                  str(value)
              )

          readme.write_text(
              content.rstrip() + "\n",
              encoding="utf-8"
          )

          print("README completely regenerated.")
          print()
          print(f"Total problems: {values['TOTAL']}")

          for key, value in values.items():
              print(f"{key}: {value}")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore: organize solutions and update stats"

      - name: Push changes
        run: |
          git fetch origin main

          # Rebase our generated commit on top of anything
          # that reached main while the workflow was running.
          git rebase origin/main

          git push origin HEAD:main
